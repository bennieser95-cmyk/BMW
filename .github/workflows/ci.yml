name: CI

on:
  pull_request:
  push:
    branches:
      - main
  deployment_status:
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate code and tests
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Check architecture boundaries
        run: npm run arch:check
      - name: Run tests with coverage
        run: npm run test:coverage
      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 7

  sonar:
    name: SonarQube quality gate
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Download coverage report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: coverage
          path: coverage
      - name: Run scanner and wait for the quality gate
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: npx --yes --package=sonarqube-scanner@5.0.2 -- sonar-scanner -Dsonar.qualitygate.wait=true

  security:
    name: CodeQL, dependency audit, and secret scan
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Initialize CodeQL
        uses: github/codeql-action/init@4bfa242aa49c5f7c6770b98670d354a7dfac05f8
        with:
          languages: javascript-typescript
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Analyze repository for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@4bfa242aa49c5f7c6770b98670d354a7dfac05f8
        with:
          category: /language:javascript-typescript

  license-compliance:
    name: Open-source license allowlist
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check production dependency licenses
        run: >-
          npx --yes license-checker@25.0.1
          --production
          --onlyAllow "MIT;Apache-2.0;BSD;BSD-2-Clause;BSD-3-Clause;ISC"
          --json
          --out license-report.json
      - name: Upload license report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: license-report
          path: license-report.json
          if-no-files-found: error
          retention-days: 90

  preview-smoke:
    name: Preview smoke and accessibility tests
    if: github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Preview'
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ github.event.deployment_status.environment_url }}
      VERCEL_PROJECT_SLUG: ${{ vars.VERCEL_PROJECT_SLUG }}
    steps:
      - name: Check out trusted test definitions
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Validate deployment ownership before sending any bypass secret
        env:
          VERCEL_READ_TOKEN: ${{ secrets.VERCEL_READ_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: node scripts/ops/verify-deployment-url.mjs
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run preview smoke tests
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npm run test:e2e:smoke -- --project=chromium

  staging-e2e:
    name: Staging E2E (${{ matrix.browser }})
    if: github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'staging'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser:
          - chromium
          - firefox
          - webkit
    env:
      BASE_URL: ${{ github.event.deployment_status.environment_url }}
      VERCEL_PROJECT_SLUG: ${{ vars.VERCEL_PROJECT_SLUG }}
      STAGING_HOST: ${{ vars.STAGING_HOST }}
    steps:
      - name: Check out trusted test definitions
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Validate deployment ownership before sending any bypass secret
        env:
          VERCEL_READ_TOKEN: ${{ secrets.VERCEL_READ_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: node scripts/ops/verify-deployment-url.mjs
      - name: Install locked dependencies
        run: npm ci
      - name: Install browser
        run: npx playwright install --with-deps "${{ matrix.browser }}"
      - name: Run critical journeys, axe, and visual regression
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.STAGING_AUTOMATION_BYPASS_SECRET }}
        run: |
          npm run test:e2e -- --config=playwright.ci.config.ts --project="${{ matrix.browser }}"
          npm run test:e2e:a11y -- --project="${{ matrix.browser }}"
          npm run test:e2e:visual -- --project="${{ matrix.browser }}"

  lighthouse-staging:
    name: Lighthouse CI budgets
    if: github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'staging'
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ github.event.deployment_status.environment_url }}
      VERCEL_PROJECT_SLUG: ${{ vars.VERCEL_PROJECT_SLUG }}
      STAGING_HOST: ${{ vars.STAGING_HOST }}
    steps:
      - name: Check out trusted test definitions
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Validate deployment ownership before sending any bypass secret
        env:
          VERCEL_READ_TOKEN: ${{ secrets.VERCEL_READ_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: node scripts/ops/verify-deployment-url.mjs
      - name: Install locked dependencies
        run: npm ci
      - name: Run Lighthouse CI
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.STAGING_AUTOMATION_BYPASS_SECRET }}
        run: npx --yes --package=@lhci/cli@0.15.1 --package=puppeteer@25.16.0 lhci autorun

  staging-load:
    name: Authorized staging load test
    if: github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'staging' && vars.LOAD_TEST_AUTHORIZED == 'true'
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ github.event.deployment_status.environment_url }}
      VERCEL_PROJECT_SLUG: ${{ vars.VERCEL_PROJECT_SLUG }}
      STAGING_HOST: ${{ vars.STAGING_HOST }}
    steps:
      - name: Check out test scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - name: Validate deployment ownership before sending any bypass secret
        env:
          VERCEL_READ_TOKEN: ${{ secrets.VERCEL_READ_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: node scripts/ops/verify-deployment-url.mjs
      - name: Run approved cached-page load test
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.STAGING_AUTOMATION_BYPASS_SECRET }}
        run: docker run --rm -e BASE_URL -e VERCEL_AUTOMATION_BYPASS_SECRET -v "$PWD/scripts/performance:/scripts:ro" grafana/k6:0.54.0 run /scripts/cached-pages.js

  security-headers-staging:
    name: Verify security headers on staging
    if: github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'staging'
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ github.event.deployment_status.environment_url }}
      VERCEL_PROJECT_SLUG: ${{ vars.VERCEL_PROJECT_SLUG }}
      STAGING_HOST: ${{ vars.STAGING_HOST }}
    steps:
      - name: Check out trusted verification scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - name: Validate deployment ownership before sending any bypass secret
        env:
          VERCEL_READ_TOKEN: ${{ secrets.VERCEL_READ_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: node scripts/ops/verify-deployment-url.mjs
      - name: Verify required security headers
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.STAGING_AUTOMATION_BYPASS_SECRET }}
        run: node scripts/security/verify-headers.mjs

  zap-baseline:
    name: Nightly ZAP baseline against staging
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BASE_URL: ${{ vars.STAGING_BASE_URL }}
      VERCEL_PROJECT_SLUG: ${{ vars.VERCEL_PROJECT_SLUG }}
      STAGING_HOST: ${{ vars.STAGING_HOST }}
      ZAP_AUTH_HEADER_SITE: ${{ vars.STAGING_BASE_URL }}
    steps:
      - name: Check out trusted ZAP policy and URL validation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - name: Validate staging URL before sending the bypass secret
        env:
          VERCEL_READ_TOKEN: ${{ secrets.VERCEL_READ_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: node scripts/ops/verify-deployment-url.mjs
      - name: Scan protected staging
        uses: zaproxy/action-baseline@7c4deb10e6261301961c86d65d54a516394f9aed
        env:
          ZAP_AUTH_HEADER: x-vercel-protection-bypass
          ZAP_AUTH_HEADER_VALUE: ${{ secrets.STAGING_AUTOMATION_BYPASS_SECRET }}
        with:
          target: ${{ vars.STAGING_BASE_URL }}
          allow_issue_writing: false
          fail_action: true
          artifact_name: zap-staging-baseline
